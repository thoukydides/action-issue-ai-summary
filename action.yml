name: Issue AI Summary
author: Alexander Thoukydides
description: Use AI to summarise an issue and its comments
branding:
  icon: 'activity'
  color: 'blue'

inputs:
  issue_number:
    description: The GitHub issue to summarise
    required: true
    type: number
  prompt_file:
    description: Path to a custom .prompt.yml file containing the AI prompt template
    type: string
  input_tokens:
    description: The maximum number of input tokens that the AI model will accept (used to guide truncation of the issue body and comments to fit the available context)
    type: number
    default: 8000
  input_prompt_tokens:
    description: The number of input tokens reserved for the prompt template itself (deducted from input_tokens when truncating the issue)
    type: number
    default: 100
  output_tokens:
    description: The maximum number of output tokens for the AI model to generate (only affects truncation of the generated summary; if it is too small, the model may drop sections of the response)
    type: number
    default: 4000

outputs:
  response:
    description: The response from the AI model
    value: ${{ steps.ai.outputs.response }}
  context:
    description: The issue context that was provided to the AI
    value: ${{ steps.context.outputs.result }}
  issue_title:
    description: The issue title
    value: ${{ steps.context.outputs.issue_title }}
  issue_url:
    description: The issue URL
    value: ${{ steps.context.outputs.issue_url }}
  issue_user:
    description: The issue author
    value: ${{ steps.context.outputs.issue_user }}

runs:
  using: composite

  steps:
    - name: Fetch the issue and prepare it for LLM input context
      id: context
      uses: actions/github-script@v7
      with:
        script: | # javascript
          // Let the issue body use up to 25% of the available context
          const CHARS_PER_TOKEN = 3; // (1 token ≈ 4 prose characters or 3-3.5 for code/logs)
          const MAX_ISSUE_CHARS = (${{ inputs.input_tokens }} - ${{ inputs.input_prompt_tokens }}) * CHARS_PER_TOKEN;
          const MIN_BODY_CHARS  = Math.floor(MAX_ISSUE_CHARS * 0.25);

          // Retrieve the issue and its comments
          const issue_id = {
              owner:          context.repo.owner,
              repo:           context.repo.repo,
              issue_number:   ${{ inputs.issue_number }}
          };
          const issue = (await github.rest.issues.get(issue_id)).data;
          let allComments = await github.paginate(github.rest.issues.listComments, issue_id);

          // Provide useful fields as discrete outputs
          core.setOutput('issue_title', issue.title);
          core.setOutput('issue_url',   issue.html_url);
          core.setOutput('issue_user',  issue.user.login);

          // Exclude any comments by bots (e.g. 'github-actions' or 'dosubot')
          const userComments = allComments.filter(c => c.user.type !== 'Bot');
          const botCommentsCount = allComments.length - userComments.length;
          core.summary.addRaw(`Issue [#${issue.number}](${issue.url}) ${issue.title}`, true);
          core.info(`${userComments.length} comments + ${botCommentsCount} by bots`);
          core.debug(`Issue:\n${JSON.stringify(issue, null, 4)}`);
          core.debug(`Comments:\n${JSON.stringify(allComments, null, 4)}`);

          // Construct the issue context and check whether it is small enough
          const makeIssueContext = (body, comments) => ({
              title:      issue.title,
              user:       issue.user.login,
              body,
              created_at: issue.created_at,
              labels:     issue.labels.map(l => l.name),
              comments:   comments.map(({ body, user, author_association, created_at }) => ({ user: user.login, body, role: author_association, created_at }))
          });
          const issueContextChars = (body, comments) => JSON.stringify(makeIssueContext(body, comments )).length;
          const issueContextFits = (body, comments) => issueContextChars(body, comments) <= MAX_ISSUE_CHARS;
          const logProgress = (description, body, comments) => {
              const size = issueContextChars(body, comments);
              const deltaPercent = 100 * (size - MAX_ISSUE_CHARS) / MAX_ISSUE_CHARS;
              core.info(`${description} issue context: ${size} characters [${deltaPercent.toFixed(1)}%] (${body.length} body characters + ${comments.length} comments)`);
          };
          core.info(`Input context budget (${{ inputs.input_tokens }} tokens): ${{ inputs.input_prompt_tokens }} prompt tokens + ${MAX_ISSUE_CHARS} issue characters`);
          logProgress('Raw', issue.body ?? '', allComments);

          // Strip anything resembling ANSI codes from the body and comments
          const ANSI_ESCAPE = /(?:\x1B|ESC)\[[0-9;]*[msuK]/g;
          const stripAnsiCodes = (text) => text.replaceAll(ANSI_ESCAPE, '');
          const cleanBody = stripAnsiCodes(issue.body ?? '');
          const mapCommentsBody = (comments, fn) => comments.map(({ body, ...rest }) => ({ body: fn(body), ...rest }));
          const cleanComments = mapCommentsBody(userComments, stripAnsiCodes);
          logProgress('Cleaned', cleanBody, cleanComments);

          // Marker for any removed content
          const TRUNCATION_MARKER = '\n\n[…truncated…]\n\n';
          const truncateAll = (match) => TRUNCATION_MARKER.length < match ? TRUNCATION_MARKER : match;

          // Truncate any large blocks that resemble logs
          const truncateLogs = (text, aggressive) => {
              const LOG_RE = [
                  // Matterbridge format logs
                  /^(?:\w* ?\[\d\d:\d\d:\d\d\.\d\d\d\] ?\[.*\n)+/gm,
                  // Homebridge format logs
                  /(?:^\[\d\d?[-\/\.]\d\d?[-\/\.]\d\d\d\d, \d\d?:\d\d:\d\d(?: \w+)?\] .*\n)+/gm,
                  // Repeated date stamps at the start of lines
                  /(?:^\[?\d\d\d\d[-\/\.]\d\d?[-\/\.]\d\d?\D.*\n){5,}/gm,
                  /(?:^\[?\d\d?[-\/\.]\d\d?[-\/\.]\d\d\d\d\D.*\n){5,}/gm
              ];
              for (const re of LOG_RE) {
                  text = text.replaceAll(re, match => {
                      if (aggressive) return truncateAll(match);
                      const lines = match.split('\n');
                      const replacement = [
                          ...lines.slice(0, 3),   // Keep first 3 lines
                          TRUNCATION_MARKER,
                          ...lines.slice(-3)      // Keep last 3 lines
                      ].join('\n');
                      return replacement.length < match.length ? replacement : match;
                  });
              }
              return text;
          };

          // Truncate any code blocks (in their entirety)
          const truncateCodeBlocks = (text) => {
              const CODE_RE = [
                  // Fenced code blocks
                  /^```\S*\n[\s\S]*?\n```/gm,
                  /^~~~\S*\n[\s\S]*?\n~~~/gm,
                  // Indented code blocks (at least 4 spaces or 1 tab)
                  /(?:^|\n\n)(?:(?:    |\t).*\n)(?:(?:    |\t).*\n|\s*\n)*(?=\n|$)/g
              ];
              for (const re of CODE_RE) text = text.replaceAll(re, truncateAll);
              return text;
          };

          // Truncate text (try to use good break points, but meet target regardless)
          const sentenceSegmenter = new Intl.Segmenter(undefined, { granularity: 'sentence' });
          const wordSegmenter     = new Intl.Segmenter(undefined, { granularity: 'word' });
          const truncateText = (text, maxChars) => {
              if (text.length <= maxChars)                return text;
              if (maxChars < TRUNCATION_MARKER.length)    return '';

              // Partition the text with different granularity
              const textPartitions = [
                  text.split(/(\n\n+)/), // (paragraphs)
                  [...sentenceSegmenter.segment(text)].map(({ segment }) => segment),
                  [...wordSegmenter    .segment(text)].map(({ segment }) => segment),
              ];

              // Search for a partition under the target length
              const choosePrefix = (partitions, maxChars) => {
                  const minChars = Math.floor(maxChars * 0.8);
                  let prefix, length;
                  for (const partition of partitions) {
                      // Find longest length of this partition under the limit
                      prefix = [];
                      length = 0;
                      for (const segment of partition) {
                          if (maxChars < length + segment.length) break;
                          prefix.push(segment);
                          length += segment.length;
                      }
                      if (minChars <= length) break;
                  }
                  return prefix;
              };
              const chooseSuffix = (partitions, maxChars) =>
                  choosePrefix(partitions.map(p => p.toReversed()), maxChars).toReversed();

              // Cut out the middle of the text to end up under the target
              const maxPrefixChars = Math.floor((maxChars - TRUNCATION_MARKER.length) / 2);
              const prefix = choosePrefix(textPartitions, maxPrefixChars).join('').trimEnd();
              const maxSuffixChars = Math.floor(maxChars - prefix.length - TRUNCATION_MARKER.length);
              const suffix = chooseSuffix(textPartitions, maxSuffixChars).join('').trimStart();
              return `${prefix}${TRUNCATION_MARKER}${suffix}`;
          };

          // Limit body to greater of space left by comments or its minimum size
          const cleanCommentsChars = issueContextChars('', cleanComments);
          const maxBodyChars = Math.max(MAX_ISSUE_CHARS - cleanCommentsChars, MIN_BODY_CHARS)
          core.info(`Body context budget: ${maxBodyChars} characters (comments = ${cleanCommentsChars} characters)`);

          // Truncate the body to the selected size
          let body = cleanBody;
          if (maxBodyChars < body.length) body = truncateLogs(body, false);
          if (maxBodyChars < body.length) body = truncateLogs(cleanBody, true); // (deliberately not 'body')
          if (maxBodyChars < body.length) body = truncateCodeBlocks(body);
          if (maxBodyChars < body.length) body = truncateText(body, maxBodyChars);
          logProgress('Body processed', body, cleanComments);

          // First try to fit all comments by removing logs and code blocks
          let comments = cleanComments;
          if (!issueContextFits(body, comments)) comments = mapCommentsBody(comments,      body => truncateLogs(body, false));
          if (!issueContextFits(body, comments)) comments = mapCommentsBody(cleanComments, body => truncateLogs(body, true)); // (deliberately not 'body')
          if (!issueContextFits(body, comments)) comments = mapCommentsBody(comments,      truncateCodeBlocks);
          logProgress('Comments stripped', body, comments);

          // Identify last block of comments by a project maintainer
          const MAINTAINER_ASSOCIATIONS = ['OWNER', 'MEMBER', 'COLLABORATOR'];
          const isMaintainerComment = (comment) => MAINTAINER_ASSOCIATIONS.includes(comment.author_association);
          const lastMaintainerIndex = comments.findLastIndex(isMaintainerComment);
          const firstMaintainerIndex = comments.slice(0, lastMaintainerIndex).findLastIndex(c => !isMaintainerComment(c)) + 1;
          const maintainerCommentTail = lastMaintainerIndex !== -1 ? comments.length - firstMaintainerIndex : 0;

          // Determine how many comments currently fit in the context
          let fitsCommentTail = comments.length;
          while (0 < fitsCommentTail && !issueContextFits(body, comments.slice(-fitsCommentTail))) --fitsCommentTail;

          // Choose the number of comments to squeeze into the context
          const MAX_PRIORITY_COMMENTS = 10;
          const priorityCommentTail = Math.min(maintainerCommentTail + 1, comments.length, MAX_PRIORITY_COMMENTS); // (include one non-maintainer comment)
          const MIN_COMMENTS = 3;
          const commentTail = Math.min(Math.max(priorityCommentTail, fitsCommentTail, MIN_COMMENTS), comments.length);
          core.info(`Comments count: ${commentTail} selected (${fitsCommentTail} or ${cleanComments.length} total, ${maintainerCommentTail} maintainer, ${priorityCommentTail} prioritised)`);
          if (commentTail !== comments.length) core.warning(`Discarded ${comments.length - commentTail} oldest comments to fit context`);
          comments = comments.slice(-commentTail);

          // Truncate comment bodies as necessary to fit within the context
          const nullComments = mapCommentsBody(comments, body => '');
          let availableCommentChars = MAX_ISSUE_CHARS - issueContextChars(body, nullComments);
          comments = comments.map(({ body, ...rest }, index) => {
              // Available context for this comment, if equal limit applied
              const tail = comments.length - index;
              const equalMaxChars = Math.floor(availableCommentChars / tail);
              const tailChars = comments.slice(index + 1).reduce((acc, c) => acc + Math.min(c.body.length, equalMaxChars), 0);
              const maxCommentChars = availableCommentChars - tailChars;

              // Truncate this comment to the selected size
              body = truncateText(body, maxCommentChars);
              availableCommentChars -= body.length;
              return { body, ...rest };
          });
          logProgress('Final', body, comments);

          // Return the prepared issue
          return makeIssueContext(body, comments);

    - name: Check the most recent release
      id: release
      uses: actions/github-script@v7
      with:
        result-encoding: string
        script: | # javascript
          try {
              const release = (await github.rest.repos.getLatestRelease(context.repo)).data;
              core.info(`Latest release: ${release.tag_name}: ${release.html_url}`);
              return release.tag_name;
          } catch (err) {
              core.error(`Failed to retrieve latest release: ${err.message}`);
              return 'latest release';
          }

    - name: Resolve prompt path
      id: resolve
      shell: bash
      run: | # shell
        if [ -z "${{ inputs.prompt_file }}" ]; then
          echo "path=${{ github.action_path }}/default.prompt.yml" >> $GITHUB_OUTPUT
        else
          echo "path=${{ inputs.prompt_file }}" >> $GITHUB_OUTPUT
        fi

    - name: AI inference
      id: ai
      uses: actions/ai-inference@v1
      with:
        prompt-file: ${{ steps.resolve.outputs.path }}
        max-tokens: ${{ toJSON(inputs.output_tokens) }}
        input: | # yaml
          owner:      ${{ github.repository_owner }}
          user:       ${{ steps.context.outputs.issue_user }}
          release:    ${{ steps.release.outputs.result }}
          context: |
            ${{ steps.context.outputs.result }}