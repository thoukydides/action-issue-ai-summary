name: Issue AI Summary
author: Alexander Thoukydides
description: Use AI to summarise an issue and its comments
branding:
  icon: 'activity'
  color: 'blue'

inputs:
  gemini_api_key:
    description: The Google AI Studio Gemini API key
    required: true
    type: string
  repository:
    description: The repository to check in the format 'owner/repo'
    type: string
    default: ${{ github.repository }}
  issue_number:
    description: The GitHub issue to summarise
    required: true
    type: number
  include_comments:
    description: Should comments be included in the model's context
    type: boolean
    default: true
  prompt_file:
    description: Path to a custom .prompt.yml file containing the AI prompt template
    type: string
  prompt_vars:
    description: Additional template variables in YAML format to substitute into the AI prompt
    type: string
    default: ''
  prompt_vars_files:
    description: Additional template variables in YAML format, where the values are file paths
    type: string
    default: ''
  input_tokens:
    description: The maximum number of input tokens that the AI model will accept (used to guide truncation of the issue body and comments to fit the available context)
    type: number
    default: 50000
  input_prompt_tokens:
    description: The number of input tokens reserved for the prompt template itself (deducted from input_tokens when truncating the issue)
    type: number
    default: 100
  output_tokens:
    description: The maximum number of output tokens for the AI model to generate (only affects truncation of the generated summary; if it is too small, the model may drop sections of the response)
    type: number
    default: 50000

outputs:
  response:
    description: The response from the AI model
    value: ${{ steps.ai.outputs.response }}
  context:
    description: The issue context that was provided to the AI
    value: ${{ steps.context.outputs.result }}
  issue_title:
    description: The issue title
    value: ${{ steps.context.outputs.issue_title }}
  issue_url:
    description: The issue URL
    value: ${{ steps.context.outputs.issue_url }}
  issue_user:
    description: The issue author
    value: ${{ steps.context.outputs.issue_user }}

runs:
  using: composite

  steps:
    - name: Fetch the issue and prepare it for LLM input context
      id: context
      uses: actions/github-script@v7
      env:
        INPUT_REPOSITORY:           ${{ inputs.repository }}
        INPUT_ISSUE_NUMBER:         ${{ inputs.issue_number }}
        INPUT_INCLUDE_COMMENTS:     ${{ inputs.include_comments }}
        INPUT_INPUT_TOKENS:         ${{ inputs.input_tokens }}
        INPUT_INPUT_PROMPT_TOKENS:  ${{ inputs.input_prompt_tokens }}
      with:
        script: | # javascript
          const { default: fn } = await import('${{ github.action_path }}/dist/index.js');
          return await fn(github);

    - name: AI inference
      id: ai
      #uses: actions/ai-inference@v1
      uses: thoukydides/ai-inference-debug@main
      with:
        endpoint: https://generativelanguage.googleapis.com/v1beta/openai/
        custom-headers: |
          Authorization: Bearer ${{ inputs.gemini_api_key }}
        prompt-file:  ${{ inputs.prompt_file || format('{0}/default.prompt.yml', github.action_path) }}
        max-tokens:   ${{ inputs.output_tokens }}
        input: | # yaml
          owner:      ${{ steps.context.outputs.owner }}
          repository: ${{ steps.context.outputs.repo }}
          user:       ${{ steps.context.outputs.issue_user }}
          release:    ${{ steps.context.outputs.release }}
          context: >-
            ${{ steps.context.outputs.result }}
          ${{ inputs.prompt_vars }}
        file_input: | # yaml
          ${{ inputs.prompt_vars_files }}